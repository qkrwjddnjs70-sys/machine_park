      <div class="section-body">
        ${items.length===0?'<div class="no-data">해당 원료 없음</div>':buildTable(items,m)}
        ${m.hasTop3&&items.length>0?'<div class="section-note">💡 원료명 클릭 → 19주 차트 + TOP3 추천 상품</div>':''}
      </div>`;
    main.appendChild(card);
  });
  // Trend
  const tr=document.createElement('div');tr.className='trend-section';
  tr.innerHTML=`<h2>📊 전체 원료 ${data.all_trends.length}개 트렌드</h2>
    <div class="trend-search"><input type="text" placeholder="원료명 검색..." oninput="filterTrend(this,'tg-${data.mmdd}')"></div>
    <div class="trend-grid" id="tg-${data.mmdd}"></div>`;
  main.appendChild(tr);
  container.appendChild(main);
  const grid=tr.querySelector(`#tg-${data.mmdd}`);
  data.all_trends.forEach(t=>{
    const vs=t.ts_s,mx=Math.max(...vs,1);
    const sp=vs.slice(-8).map(v=>'▁▂▃▄▅▆▇█'[Math.min(7,Math.floor(v/mx*7.99))]).join('');
    const last=vs[vs.length-1],prev2=vs.length>=3?(vs[vs.length-2]+vs[vs.length-3])/2:(vs[vs.length-2]||last);
    const wow=prev2>0?((last-prev2)/prev2*100):0;
    const d=document.createElement('div');d.className='trend-card';d.dataset.name=t.name;
    d.innerHTML=`<div class="trend-card-name">${t.name}</div><span class="trend-card-spark">${sp}</span><div class="trend-card-sub">매출 ${fmt(last)} · WoW ${wow>0?'+':''}${wow.toFixed(0)}%</div>`;
    d.onclick=()=>showDetail(t.name,data);
    grid.appendChild(d);
  });
}

function buildTable(items,meta){
  const isMG=meta.key==='mom_grow';
  let hdr=isMG?
    `<tr style="background:#fff8e1"><th style="text-align:left">원료</th><th>매출(현)</th><th>매출MoM</th><th>검색(현)</th><th>검색MoM</th><th>매출추이</th><th>검색추이</th></tr>`:
    `<tr style="background:#e8eaf6"><th style="text-align:left">원료</th><th>매출(현)</th><th>매출WoW</th><th>매출MoM</th><th>검색(현)</th><th>검색WoW</th><th>검색MoM</th><th>매출추이</th><th>검색추이</th></tr>`;
  const rows=items.map(r=>{
    let cells=isMG?
      `<td class="num">${fmt(r.sales_cur)}</td><td class="num">${fp(r.mom_s)}</td><td class="num">${(r.search_cur||0).toLocaleString()}</td><td class="num">${fp(r.mom_k)}</td><td class="spark">${r.spark_s}</td><td class="spark spark-k">${r.spark_k}</td>`:
      `<td class="num">${fmt(r.sales_cur)}</td><td class="num">${fp(r.wow_s)}</td><td class="num">${fp(r.mom_s)}</td><td class="num">${(r.search_cur||0).toLocaleString()}</td><td class="num">${fp(r.wow_k)}</td><td class="num">${fp(r.mom_k)}</td><td class="spark">${r.spark_s}</td><td class="spark spark-k">${r.spark_k}</td>`;
    return `<tr onclick="showDetail('${r.name}',currentCtxData())" style="cursor:pointer"><td><span class="ing-name">${r.name}</span></td>${cells}</tr>`;
  }).join('');
  return`<div style="overflow-x:auto"><table><thead>${hdr}</thead><tbody>${rows}</tbody></table></div>`;
}

function filterTrend(inp,gid){const q=inp.value.trim();document.querySelectorAll('#'+gid+' .trend-card').forEach(el=>{el.style.display=(!q||el.dataset.name.includes(q))?'':'none';});}
function toggleSec(h){const b=h.nextElementSibling,t=h.querySelector('.toggle');if(b.classList.contains('collapsed')){b.classList.remove('collapsed');b.style.maxHeight='10000px';t.style.transform='';}else{b.style.maxHeight='0';b.classList.add('collapsed');t.style.transform='rotate(-90deg)';}}
function switchTab(id,btn){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById('tab-'+id).classList.add('active');}
function currentCtxData(){return document.getElementById('tab-archive').classList.contains('active')?arcData:curData;}

// Init current
buildPage(curData, document.getElementById('tab-current'));

// Archive buttons
const wkBtns=document.getElementById('wkBtns');
ALL_DATA.forEach((d,i)=>{
  const btn=document.createElement('button');
  btn.className='wk-btn'+(i===ALL_DATA.length-1?' active':'');
  btn.textContent=d.label.replace('2026년 ','');
  btn.onclick=()=>{
    document.querySelectorAll('.wk-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    arcData=d;
    buildPage(d,document.getElementById('archiveContent'));
  };
  wkBtns.appendChild(btn);
});
buildPage(arcData, document.getElementById('archiveContent'));

function showDetail(name,data){
  if(!data)data=currentCtxData();
  let r=null;
  for(const m of SM){const f=(data[m.key]||[]).find(x=>x.name===name);if(f){r={...f,_sec:m};break;}}
  const trend=data.all_trends.find(x=>x.name===name);
  const ts_s=r?.ts_s||trend?.ts_s||[],ts_k=r?.ts_k||trend?.ts_k||[],weeks=data.weeks;
  const mxS=Math.max(...ts_s.filter(v=>v>0),1),mxK=Math.max(...ts_k.filter(v=>v>0),1);
  const bc=(arr,color,mx,wks)=>arr.map((v,i)=>{
    const h=Math.max(2,Math.round(v/mx*50)),isL=i===arr.length-1;
    return`<div class="bar-wrap"><div class="bar" style="height:${h}px;background:${isL?color:color+'55'}" title="${wks[i]}: ${v.toLocaleString()}"></div><div class="bar-lbl" style="${isL?'font-weight:700;color:'+color:''}">${wks[i]}</div></div>`;
  }).join('');
  const st=r?._sec?`<span style="background:${r._sec.color};color:#fff;border-radius:10px;padding:2px 9px;font-size:10px;margin-left:8px">${r._sec.label}</span>`:'';
  const t3h=r?.top3?.length?`<div style="margin-top:4px;font-size:11px;font-weight:700;color:#1a237e">🛒 TOP3 추천 상품</div><ul class="top3-list">${r.top3.map((p,i)=>`<li class="top3-item"><span class="top3-rank">${['🥇','🥈','🥉'][i]}</span><div class="top3-info"><div class="top3-name">${p.name}</div><div class="top3-partner">🏢 ${p.partner}</div></div><div class="top3-sales">${fmt(p.sales)}</div></li>`).join('')}</ul>`:'';
  document.getElementById('modalContent').innerHTML=`
    <div class="modal-header"><h3>${name}${st}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="chart-row"><div class="chart-label">📦 매출 추이 (${weeks.length}주)</div><div class="bar-chart">${bc(ts_s,'#1565c0',mxS,weeks)}</div>
    <div class="chart-stats"><div>이번주: <span class="csv">${fmt(ts_s[ts_s.length-1])}</span></div>${r?`<div>WoW: <span class="csv">${r.wow_s>0?'+':''}${r.wow_s?.toFixed(1)}%</span></div><div>MoM: <span class="csv">${r.mom_s>0?'+':''}${r.mom_s?.toFixed(1)}%</span></div>`:''}</div></div>
    <div class="chart-row"><div class="chart-label">🔍 검색 추이 (${weeks.length}주)</div><div class="bar-chart">${bc(ts_k,'#6a1b9a',mxK,weeks)}</div>
    <div class="chart-stats"><div>이번주: <span class="csv">${(ts_k[ts_k.length-1]||0).toLocaleString()}</span></div>${r?`<div>WoW: <span class="csv">${r.wow_k>0?'+':''}${r.wow_k?.toFixed(1)}%</span></div><div>MoM: <span class="csv">${r.mom_k>0?'+':''}${r.mom_k?.toFixed(1)}%</span></div>`:''}</div></div>
    ${t3h}`;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(e){if(!e||e.target===document.getElementById('modalOverlay'))document.getElementById('modalOverlay').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
</body>
</html>
